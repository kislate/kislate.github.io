<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>给自己留一块空白 — kislate</title><meta name="description" content="个人博客的第一篇示范短文：关于这个小站，以及一个简单的开始。"><meta name="theme-color" content="#f5f0e6"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/style.css"><script defer src="../assets/site.js"></script></head><body id="top" data-root="../" data-page="notes"><a class="skip" href="#main">跳到正文</a><div class="shell"><header class="site-header" id="site-header"></header><main id="main"><a class="back-link" href="./">← 返回手记</a><article class="article"><header class="article-head"><div class="eyebrow">Note 001 / 示范短文</div><h1>给自己留一块空白</h1><div class="article-meta">2026.11.01 &nbsp; / &nbsp; DEMO &nbsp; / &nbsp; 约 1 分钟</div></header><div class="article-body"><p>这是新站的第一张草稿。个人介绍先从旧站里的内容整理起，项目的位置也先留出来。</p><p>旧站有家乡、游戏、动漫，也有小巷、落日和小猫。那些记录仍保存在旧仓库里。新站换了版式，接下来可以继续放做过的项目，也继续记日常。</p><blockquote>留白，也是一个开始。</blockquote><h2>关于这份初稿</h2><p>米黄色的底，暖棕色的字，一点陶土红。首页放个人介绍与经历；项目页留给代码、图像与演示视频；这里留给文字。</p><p>这篇文字只用来演示文章的排版。下一篇，就留给真正想记录的事。</p></div><a class="text-link" style="margin-top:20px" href="./">所有手记 <span class="arrow" aria-hidden="true">↗</span></a></article></main><footer class="site-footer" id="site-footer"></footer></div></body></html>
